
name: Check ngrok Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check ngrok token
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "NGROK_AUTH_TOKEN is missing"
            exit 1
          fi
          echo "NGROK_AUTH_TOKEN is configured"
