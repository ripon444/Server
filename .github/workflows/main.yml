
name: Validate ngrok Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Download ngrok
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "$env:RUNNER_TEMP\ngrok.zip"
          Expand-Archive `
            -Path "$env:RUNNER_TEMP\ngrok.zip" `
            -DestinationPath "$env:RUNNER_TEMP\ngrok" `
            -Force

      - name: Validate authentication
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw "NGROK_AUTH_TOKEN secret is missing"
          }

          & "$env:RUNNER_TEMP\ngrok\ngrok.exe" config add-authtoken $env:NGROK_AUTH_TOKEN

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok authentication setup failed"
          }

          Write-Output "ngrok authentication setup completed"
